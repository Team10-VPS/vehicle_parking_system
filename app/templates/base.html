<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Vehicle Parking System{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 12px}
    nav a{margin-right:12px} .flash{background:#fff3cd;padding:8px;margin:8px 0;border-radius:4px}
    .slot{display:inline-block;padding:10px 14px;margin:4px;border-radius:6px;color:#fff}
    .available{background:#2e7d32}.occupied{background:#c62828}
    table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;text-align:left}
  </style>
</head>
<body>
<nav>
  <a href="{{ url_for('slots.dashboard') }}">Dashboard</a>
  <a href="{{ url_for('bookings.history') }}">My Bookings</a>
  {% if current_user %}
    {% if current_user.is_admin %}
    <a href="{{ url_for('admin.slots') }}">Admin Slots</a>
    <a href="{{ url_for('admin.bookings') }}">Admin Bookings</a>
    {% endif %}
    <a href="{{ url_for('auth.logout') }}">Logout</a>
  {% else %}
    <a href="{{ url_for('auth.login') }}">Login</a>
    <a href="{{ url_for('auth.register') }}">Register</a>
  {% endif %}
</nav>
{% with msgs = get_flashed_messages() %}
  {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}{% block content %}
<h2>Manage Parking Slots</h2>
<form method="post">
  <input name="slot_number" placeholder="Slot number" required>
  <input name="floor" placeholder="Floor" required>
  <button type="submit">Add slot</button>
</form>
<table>
<tr><th>Slot</th><th>Floor</th><th>Status</th><th></th></tr>
{% for s in slots %}
<tr><td>{{ s.slot_number }}</td><td>{{ s.floor }}</td><td>{{ s.status }}</td>
<td><form method="post" action="{{ url_for('admin.delete_slot', slot_id=s.id) }}"><button>Remove</button></form></td></tr>
{% endfor %}</table>{% endblock %}


name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build check (app imports and creates)
        env:
          SECRET_KEY: ci-test-secret-key
        run: >
          python -c "from app import create_app; create_app({'SECRET_KEY': 'ci-test-secret-key', 'SQLALCHEMY_DATABASE_URI': 'sqlite:///:memory:'})"

      - name: Run unit and integration tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest -v --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
